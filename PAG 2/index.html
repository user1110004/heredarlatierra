<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo y Territorio - Web Art</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            /* Degradado exacto extraído de la imagen (Rosa a Gris) */
            background: linear-gradient(to right, #e59ca2 0%, #a1788e 40%, #5d5360 70%, #4b4c51 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Evita el scroll horizontal */
            overflow-y: auto;   /* Habilita el scroll vertical si la pantalla es muy baja */
        }

        /* Contenedor principal en dos columnas */
        .interfaz-arte {
            display: flex;
            flex-direction: row;
            width: 100%;
            min-height: 100vh;
            max-width: 1500px; /* Se amplía ligeramente el ancho máximo del lienzo */
            padding: 40px 5vw;
            align-items: center;
            justify-content: space-between;
            gap: 6vw;
        }

        /* COLUMNA IZQUIERDA: Contiene la obra de arte (Se aumenta su peso visual en la proporción) */
        .columna-imagen {
            flex: 14; /* Mayor espacio dedicado a la obra */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-arte {
            position: relative;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 580px; /* Aumentado de 480px a 580px para darle mayor protagonismo a la imagen */
            /* Proporción exacta para que la imagen se renderice completa de arriba a abajo */
            aspect-ratio: 550 / 920; 
            background: transparent;
        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* COLUMNA DERECHA: Contiene el bloque de texto estático */
        .columna-texto {
            flex: 10; /* Se reduce ligeramente el peso proporcional para equilibrar la composición */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            user-select: none;
        }

        /* Título estático con estética de la tipografía de referencia */
        .titulo-arte {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            font-size: clamp(2.2rem, 5vw, 4.5rem); /* Se escala de forma más controlada para no competir */
            text-transform: uppercase;
            color: #ebdcb9; /* Color crema retro */
            letter-spacing: 2px;
            line-height: 1.15;
            margin: 0;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000; /* Borde negro */
        }
        
        /* Zonas interactivas invisibles mapeadas sobre la imagen completa */
        .zona-interactiva {
            position: absolute;
            background: rgba(255, 255, 255, 0); 
            cursor: pointer;
            z-index: 10;
        }

        /* Coordenadas de audio en la imagen */
        /* Hojas de Plátano */
        .zona-platano {
            top: 28%;
            left: 20%;
            width: 65%;
            height: 20%;
            clip-path: polygon(15% 100%, 40% 10%, 75% 0%, 95% 70%, 70% 100%);
        }

        /* Cacao */
        .zona-cacao {
            top: 65%; 
            left: 36%; 
            width: 28%;
            height: 15%;
            border-radius: 50%;
        }
        
        /* Colibrí */
        .zona-colibri {
            bottom: 2%;
            left: 10%;
            width: 22%;
            height: 10%;
            border-radius: 50%;
        }

        /* Flores inferiores */
        .zona-mariposas {
            bottom: 2%;
            right: 8%;
            width: 32%;
            height: 12%;
            border-radius: 40%;
        }

        /* Ajuste responsivo para pantallas pequeñas (cambia a vertical) */
        @media (max-width: 850px) {
            .interfaz-arte {
                flex-direction: column-reverse; 
                justify-content: center;
                gap: 40px;
                padding: 40px 20px;
            }
            .columna-texto {
                align-items: center;
                text-align: center;
            }
            .contenedor-arte {
                max-width: 420px;
            }
        }
    </style>
</head>
<body>

<div class="interfaz-arte">
    
    <div class="columna-imagen">
        <div class="contenedor-arte">
            <img src="collage.jpg" alt="Cuerpo y Territorio">

            <div class="zona-interactiva zona-platano" onclick="reproducirSonido('ranas')"></div>
            <div class="zona-interactiva zona-cacao" onclick="reproducirSonido('gulumbo')"></div>
            <div class="zona-interactiva zona-colibri" onclick="reproducirSonido('pajaro')"></div>
            <div class="zona-interactiva zona-mariposas" onclick="reproducirSonido('grillocigarra')"></div>
        </div>
    </div>

    <div class="columna-texto">
        <h1 class="titulo-arte">Cuerpo</h1>
        <h1 class="titulo-arte">y territorio</h1>
    </div>

</div>

<audio id="sonido-pajaro" src="pajaro.mp3" preload="auto"></audio>
<audio id="sonido-grillocigarra" src="grillocigarra.mp3" preload="auto"></audio>
<audio id="sonido-ranas" src="ranas.mp3" preload="auto"></audio>
<audio id="sonido-gulumbo" src="gulumbo.mp3" preload="auto"></audio>

<script>
    function reproducirSonido(idAudio) {
        const audios = ['sonido-pajaro', 'sonido-grillocigarra', 'sonido-ranas', 'sonido-gulumbo'];
        audios.forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.pause(); el.currentTime = 0; }
        });

        const audioActivo = document.getElementById('sonido-' + idAudio);
        if (audioActivo) {
            audioActivo.play().catch(error => {
                console.error("Interacción previa requerida para el audio:", error);
            });
        }
    }
</script>

</body>
</html>
