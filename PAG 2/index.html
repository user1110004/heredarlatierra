<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo y Territorio - Web Art</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            /* Degradado exacto extraído de la imagen (Rosa a Gris) */
            background: linear-gradient(to right, #e59ca2 0%, #a1788e 40%, #5d5360 70%, #4b4c51 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-art {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 15px;
        }
        
        .header-art h1 {
            font-family: Arial, Helvetica, sans-serif; /* Tipografía limpia sans-serif */
            font-size: 2rem;
            letter-spacing: 6px;
            margin: 0;
            text-transform: uppercase;
            font-weight: bold;
            color: #2c252b;
        }

        .contenedor-arte {
            position: relative;
            /* Sombras suaves integradas al degradado */
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
            max-width: 550px;
            width: 100%;
            background: transparent;
            margin-bottom: 30px;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Zonas interactivas invisibles pero cliqueables */
        .zona-interactiva {
            position: absolute;
            background: rgba(255, 255, 255, 0); /* Totalmente invisible */
            cursor: pointer;
            z-index: 10;
        }
        
        /* NOTA: Si quieres ver dónde están las zonas para probarlas o reubicarlas, */
        /* cambia el '0' de arriba por '0.2' temporalmente en background */

        /* UBICACIONES DE LAS ZONAS (Ordenadas de arriba a abajo) */

        /* Hojas de Plátano (Tocado verde superior) */
        .zona-platano {
            top: 25%;
            left: 24%;
            width: 250px;
            height: 150px;
            clip-path: polygon(15% 100%, 40% 10%, 75% 0%, 95% 70%, 70% 100%);
            border-radius: 20px;
        }

        /* Cacao (Sostenido en el centro/medio por las manos) */
        .zona-cacao {
            top: 60%; 
            left: 40%; 
            width: 110px;
            height: 110px;
            border-radius: 50%;
        }
        
        /* Colibrí (Abajo izquierda - Zona Rosa) */
        .zona-colibri {
            bottom: 4%;
            left: 5%;
            width: 95px;
            height: 90px;
            border-radius: 50%;
        }

        /* NUEVA UBICACIÓN: Flores inferiores (Abajo derecha - Reubicado desde el tocado) */
        .zona-mariposas {
            bottom: 4%;
            right: 5%; /* Cambiado a "right" para ubicarlo al lado opuesto del colibrí */
            width: 150px;
            height: 110px;
            border-radius: 40%;
        }
    </style>
</head>
<body>

<div class="header-art">
    <h1>Cuerpo y Territorio</h1>
</div>

<div class="contenedor-arte">
    <img src="collage.jpg" alt="Cuerpo y Territorio">

    <div class="zona-interactiva zona-platano" onclick="reproducirSonido('ranas')"></div>
    <div class="zona-interactiva zona-cacao" onclick="reproducirSonido('gulumbo')"></div>
    <div class="zona-interactiva zona-colibri" onclick="reproducirSonido('pajaro')"></div>
    <div class="zona-interactiva zona-mariposas" onclick="reproducirSonido('grillocigarra')"></div>
</div>

<audio id="sonido-pajaro" src="pajaro.mp3" preload="auto"></audio>
<audio id="sonido-grillocigarra" src="grillocigarra.mp3" preload="auto"></audio>
<audio id="sonido-ranas" src="ranas.mp3" preload="auto"></audio>
<audio id="sonido-gulumbo" src="gulumbo.mp3" preload="auto"></audio>

<script>
    function reproducirSonido(idAudio) {
        // Detener sonidos previos para transiciones limpias
        const audios = ['sonido-pajaro', 'sonido-grillocigarra', 'sonido-ranas', 'sonido-gulumbo'];
        audios.forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.pause(); el.currentTime = 0; }
        });

        // Reproducir sonido actual
        const audioActivo = document.getElementById('sonido-' + idAudio);
        if (audioActivo) {
            audioActivo.play().catch(error => {
                console.error("Interacción previa requerida para el audio:", error);
            });
        }
    }
</script>

</body>
</html>
