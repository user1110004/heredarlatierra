<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosechar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Lora:ital,wght@0,400;1,400&display=swap');
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a3a08;}
*{box-sizing:border-box;}
.fc{
  position:fixed;inset:0;
  background-size:cover;
  background-position:center center;
  overflow:hidden;
}
.page-title{
  position:fixed;
  top:44%;
  left:50%;transform:translate(-50%,-50%);
  z-index:60;
  font-family:'Raleway',sans-serif;
  font-weight:800;
  font-size:clamp(2.8rem,6.5vw,5.5rem);
  color:#f0e0a0;
  text-shadow:
    3px 3px 0 #2a1200,
    -2px -2px 0 #2a1200,
    2px -2px 0 #2a1200,
    -2px  2px 0 #2a1200,
    0 0 30px rgba(180,130,30,.6);
  letter-spacing:.18em;
  text-transform:uppercase;
  pointer-events:none;
  white-space:nowrap;
}
.ps{
  position:absolute;cursor:pointer;
  transition:transform .2s ease;
  user-select:none;
}
.ps:hover{transform:scale(1.07) translateY(-3px);}
.ps:active{transform:scale(0.96);}
.pi{
  display:block;width:100%;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.55));
  transition:filter .4s ease;
}
/* Default glow for maiz and cacao */
.ps.harvestable .pi{
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)) drop-shadow(0 0 14px rgba(255,215,40,.85));
  animation:glow 1.7s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(255,215,40,.5));}
  50%{filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)) drop-shadow(0 0 24px rgba(255,215,40,1));}
}
/* Frijol gets extra bright green glow to stand out */
.ps.harvestable.frijol .pi{
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))
         drop-shadow(0 0 18px rgba(80,255,60,1))
         drop-shadow(0 0 32px rgba(80,255,60,.7))
         brightness(1.35);
  animation:glowF 1.5s ease-in-out infinite;
}
@keyframes glowF{
  0%,100%{
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))
           drop-shadow(0 0 12px rgba(80,255,60,.8))
           drop-shadow(0 0 22px rgba(80,255,60,.4))
           brightness(1.2);
  }
  50%{
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))
           drop-shadow(0 0 24px rgba(80,255,60,1))
           drop-shadow(0 0 42px rgba(80,255,60,.7))
           brightness(1.5);
  }
}
.ps.growing .pi{
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
  animation:none;
  opacity:.85;
}
.pl{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:rgba(15,8,1,.9);color:#f5e088;
  font-family:'Lora',serif;font-size:.66rem;font-style:italic;
  padding:2px 10px;border-radius:10px;border:1px solid rgba(200,160,50,.4);
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;
}
.ps:hover .pl{opacity:1;}
.rb{
  position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  width:80%;height:4px;background:rgba(0,0,0,.4);border-radius:2px;
  overflow:hidden;opacity:0;transition:opacity .3s;
}
.rf{height:100%;background:#6ecf40;width:0%;border-radius:2px;}
.ps.growing .rb{opacity:1;}
.hp{
  position:fixed;pointer-events:none;z-index:200;
  animation:popup 1.3s ease-out forwards;
  font-size:.9rem;font-family:'Raleway',sans-serif;font-weight:700;
  color:#ffe040;text-shadow:0 2px 6px rgba(0,0,0,.9);
}
@keyframes popup{
  0%{transform:translateY(0) scale(.4);opacity:1;}
  55%{transform:translateY(-55px) scale(1.3);opacity:1;}
  100%{transform:translateY(-100px) scale(1);opacity:0;}
}
.ib{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  z-index:50;display:flex;align-items:center;gap:.9rem;
  background:rgba(8,5,1,.88);border:1px solid rgba(200,160,50,.3);
  border-radius:16px;padding:.5rem 1.4rem;
  backdrop-filter:blur(8px);
}
.ii{display:flex;align-items:center;gap:.45rem;}
.ii+.ii{border-left:1px solid rgba(200,160,50,.18);padding-left:.9rem;}
.iic{width:28px;height:28px;object-fit:contain;}
.ic{font-family:'Raleway',sans-serif;font-weight:700;font-size:1rem;color:#f5e088;min-width:18px;text-align:center;}
.in{font-family:'Lora',serif;font-size:.62rem;color:rgba(200,160,50,.6);font-style:italic;}
.ii.up .ic{animation:ibpop .35s ease;}
@keyframes ibpop{0%{transform:scale(1);}40%{transform:scale(1.55);}100%{transform:scale(1);}}
.pt{position:fixed;pointer-events:none;z-index:150;border-radius:50%;animation:ptfly var(--d,.8s) ease-out forwards;}
@keyframes ptfly{0%{transform:translate(0,0) scale(1);opacity:.9;}100%{transform:translate(var(--tx,0),var(--ty,-60px)) scale(0);opacity:0;}}
</style>
</head>
<body>

<div class="fc" id="field"></div>
<div class="page-title">Cosechar</div>

<div class="ib" id="inv">
  <div class="ii" id="ii-maiz"><img class="iic" id="ic-maiz" alt="maiz"><div><div class="ic" id="ct-maiz">0</div><div class="in">Maíz</div></div></div>
  <div class="ii" id="ii-cacao"><img class="iic" id="ic-cacao" alt="cacao"><div><div class="ic" id="ct-cacao">0</div><div class="in">Cacao</div></div></div>
  <div class="ii" id="ii-frijol"><img class="iic" id="ic-frijol" alt="frijol"><div><div class="ic" id="ct-frijol">0</div><div class="in">Frijol</div></div></div>
</div>

const counts={maiz:0,cacao:0,frijol:0};
const harvested={};
function tImg(t){return t==='maiz'?IMG.MAIZ_T:t==='cacao'?IMG.CACAO_T:IMG.FRIJOL_T;}

function init(){
  document.getElementById('field').style.backgroundImage="url('"+IMG.FONDO+"')";
  document.getElementById('ic-maiz').src=IMG.MAIZ_H;
  document.getElementById('ic-cacao').src=IMG.CACAO_H;
  document.getElementById('ic-frijol').src=IMG.FRIJOL_H;
  buildField();
}

function buildField(){
  const field=document.getElementById('field');
  PLANTS.forEach(p=>{
    const s=document.createElement('div');
    s.className='ps harvestable'+(p.t==='frijol'?' frijol':'');
    s.style.left=p.x;
    s.style.bottom=p.b;
    s.style.width=p.w;
    s.style.zIndex=Math.round(25-parseFloat(p.b));

    const lbl=document.createElement('div'); lbl.className='pl'; lbl.textContent=p.l;
    const img=document.createElement('img');
    img.className='pi'; img.src=tImg(p.t); img.alt=p.l;
    img.style.width='100%'; img.draggable=false;
    const rb=document.createElement('div'); rb.className='rb';
    const rf=document.createElement('div'); rf.className='rf';
    rb.appendChild(rf);
    s.appendChild(lbl); s.appendChild(img); s.appendChild(rb);
    s.addEventListener('click',e=>harvest(e,p,s,img,rf));
    field.appendChild(s);
  });
}

function harvest(e,p,s,img,rf){
  if(harvested[p.id])return;
  harvested[p.id]=true;
  counts[p.t]++;
  document.getElementById('ct-'+p.t).textContent=counts[p.t];
  const ii=document.getElementById('ii-'+p.t);
  ii.classList.remove('up'); void ii.offsetWidth; ii.classList.add('up');

  const pop=document.createElement('div');
  pop.className='hp'; pop.textContent='+1';
  pop.style.left=(e.clientX-10)+'px';
  pop.style.top=(e.clientY-20)+'px';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),1400);

  spawnPt(e.clientX,e.clientY,p.t);
  s.classList.remove('harvestable','frijol');
  s.classList.add('growing');

  let prog=0;
  const steps=p.rt/80;
  const ti=setInterval(()=>{
    prog+=100/steps; rf.style.width=Math.min(prog,100)+'%';
    if(prog>=100){
      clearInterval(ti);
      s.classList.remove('growing');
      s.classList.add('harvestable');
      if(p.t==='frijol') s.classList.add('frijol');
      harvested[p.id]=false; rf.style.width='0%';
    }
  },80);
}

const pc={maiz:'#ffd700',cacao:'#a0522d',frijol:'#50ff3c'};
function spawnPt(cx,cy,t){
  const col=pc[t];
  for(let i=0;i<10;i++){
    const pt=document.createElement('div'); pt.className='pt';
    const sz=3+Math.random()*7;
    pt.style.cssText='width:'+sz+'px;height:'+sz+'px;background:'+col+';left:'+cx+'px;top:'+cy+'px;--tx:'+((Math.random()-.5)*100)+'px;--ty:'+(-(25+Math.random()*70))+'px;--d:'+(0.45+Math.random()*.65)+'s;';
    document.body.appendChild(pt); setTimeout(()=>pt.remove(),1300);
  }
}

window.addEventListener('load',init);
</script>
