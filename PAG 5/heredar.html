  background-position: center;
}
#title {
  position: absolute;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--cream);
  font-family: 'UnifrakturMaguntia', Georgia, serif;
  font-size: 3.5rem;
  letter-spacing: 2px;
  text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  z-index: 10;
  text-align: center;
}
#seed-panel {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 25px;
  background: rgba(13,10,5,0.85);
  border: 1px solid rgba(184,134,11,0.3);
  padding: 15px 30px;
  border-radius: 40px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8);
  z-index: 10;
  backdrop-filter: blur(4px);
}
.seed-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid rgba(242,232,201,0.2);
  background: #1a140a;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.seed-btn img {
  width: 70%;
  height: 70%;
  object-fit: contain;
}
.seed-btn:hover {
  border-color: var(--gold);
  transform: translateY(-4px);
}
.seed-btn.active {
  border-color: var(--cream);
  background: var(--gold);
  transform: translateY(-4px) scale(1.05);
}
.planted {
  position: absolute;
  z-index: 2;
  transform-origin: bottom center;
  animation: growIn 0.4s ease forwards;
  pointer-events: none;
}
.planted img { width: 100%; height: 100%; object-fit: contain; }
@keyframes growIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
#btn-next {
  position: absolute;
  top: 40px;
  right: 40px;
  background: var(--gold);
  color: var(--cream);
  border: 1px solid var(--cream);
  padding: 10px 20px;
  font-size: 1rem;
  font-family: 'Playfair Display', serif;
  cursor: pointer;
  border-radius: 5px;
  z-index: 20;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  transition: background 0.2s;
}
#btn-next:hover {
  background: #966f0a;
}
</style>
</head>
<body>

<div id="scene">
  <div id="scene-bg"></div>
  <h1 id="title">Heredar la Tierra</h1>
  
  <a id="btn-next" href="Cosechar.html">Ir a Cosechar →</a>

  <div id="seed-panel">
    <div class="seed-btn active" data-seed="0"><img src="semilla1.png" alt="Semilla 1"></div>
    <div class="seed-btn" data-seed="1"><img src="semilla2.png" alt="Semilla 2"></div>
    <div class="seed-btn" data-seed="2"><img src="semilla3.png" alt="Semilla 3"></div>
    <div class="seed-btn" data-seed="3"><img src="semilla4.png" alt="Semilla 4"></div>
  </div>
</div>

<script>
  const HORIZON_Y = 0.52;

  const seedData = {
    0: { src: 'semilla1.png', wr: 0.82 },
    1: { src: 'semilla2.png', wr: 0.53 },
    2: { src: 'semilla3.png', wr: 0.65 },
    3: { src: 'semilla4.png', wr: 0.50 }
  };

  let sel = 0;
  const btns = document.querySelectorAll('.seed-btn');
  btns.forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      btns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      sel = parseInt(b.getAttribute('data-seed'));
    });
  });

  // Cargar lo guardado previamente en esta sesión si existe
  let plantsStorage = JSON.parse(localStorage.getItem('plantedSeeds')) || [];
  plantsStorage.forEach(p => drawSeed(p.x, p.y, p.type));

  // Sonidos para la siembra
  const audioFiles = ['t1.mp3', 't2.mp3', 't3.mp3', 't4.mp3'];
  function playSound() {
    const a = new Audio(audioFiles[Math.floor(Math.random() * audioFiles.length)]);
    a.volume = 0.5;
    a.play().catch(()=>{});
  }

  document.getElementById('scene').addEventListener('click', function(e) {
    if (e.target.closest('#seed-panel') || e.target.closest('#btn-next')) return;
    const rect = this.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (y < rect.height * HORIZON_Y) return;

    drawSeed(x, y, sel);
    playSound();

    // Guardar coordenadas y tipo en localStorage
    plantsStorage.push({ x, y, type: sel });
    localStorage.setItem('plantedSeeds', JSON.stringify(plantsStorage));
  });

  function drawSeed(x, y, type) {
    const scene = document.getElementById('scene');
    const rect = scene.getBoundingClientRect();
    const depth = Math.min(1, (y - rect.height * HORIZON_Y) / (rect.height * (1 - HORIZON_Y)));
    const baseH = Math.round(10 + depth * 28);
    const sd = seedData[type];
    const w = Math.round(baseH * sd.wr);
    const h = baseH;

    const el = document.createElement('div');
    el.className = 'planted';
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;margin-left:-${w/2}px;margin-top:-${h}px;`;

    const img = document.createElement('img');
    img.src = sd.src;
    el.appendChild(img);
    scene.appendChild(el);
  }
</script>
</body>
