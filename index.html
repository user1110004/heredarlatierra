<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenedor Principal - Heredar la tierra</title>
  <style>
    /* Estilos globales */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: relative; 
    }

    /* El visor del iframe ocupa todo el fondo de la pantalla */
    .visor-paginas {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Contenedor del botón en la parte superior derecha */
    .navbar {
      position: absolute;
      top: 15px;
      right: 20px;
      z-index: 100;
    }

    /* Estilo para el botón dinámico único */
    .btn-siguiente {
      display: inline-flex;
      align-items: center;
      height: 45px;
      padding: 0 25px;
      background-color: rgba(20, 20, 20, 0.20); /* Alta transparencia (20%) */
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
      user-select: none;
    }

    .btn-siguiente:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .btn-siguiente:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button id="btnSiguiente" class="btn-siguiente">Siguiente</button>
  </div>

  <iframe src="PAG 1/Heredar.html" name="pantalla" class="visor-paginas" id="iframePantalla"></iframe>

  <script>
    // 1. Lista secuencial de tus páginas
    const paginas = [
      { texto: "Heredar la tierra", url: "PAG 1/Heredar.html" },
      { texto: "Cuerpo y territorio", url: "PAG 2/index.html" },
      { texto: "Casa", url: "PAG 3/index.html" },
      { texto: "Florecer", url: "PAG 4/florecer.html" },
      { texto: "Cosechar", url: "PAG 5/cosechar.html" }
    ];

    // Iniciamos en 0 porque el iframe arranca mostrando "Heredar la tierra"
    let indiceActual = 0;

    const boton = document.getElementById('btnSiguiente');
    const iframe = document.getElementById('iframePantalla');

    // 2. Función encargada de calcular y pintar el texto de la página que viene después
    function actualizarTextoBoton() {
      // Calculamos cuál es la página que sigue a la actual
      let indiceSiguiente = (indiceActual + 1) % paginas.length;
      
      // El botón muestra única y exclusivamente el nombre de esa página siguiente
      boton.textContent = paginas[indiceSiguiente].texto;
    }

    // 3. Manejo del clic controlado por JavaScript
    boton.addEventListener('click', function() {
      // Avanzamos el índice a la página siguiente
      indiceActual = (indiceActual + 1) % paginas.length;
      
      // Cambiamos el contenido del iframe a la nueva página activa
      iframe.src = paginas[indiceActual].url;
      
      // Actualizamos el botón para que calcule y muestre la que vendrá después de esta
      actualizarTextoBoton();
    });

    // Inicialización al cargar la web por primera vez
    actualizarTextoBoton();
  </script>

</body>
</html>
