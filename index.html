<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenedor Principal - Heredar la tierra</title>
  <style>
    /* Estilos globales */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Evita barras de scroll dobles en la pantalla */
      font-family: Arial, sans-serif;
    }

    /* Botón para abrir/cerrar la barra lateral (Menú Hamburguesa) */
    .btn-menu {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      background-color: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Estructura de la Sidebar (Oculta por defecto a la izquierda) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #222;
      padding-top: 20px;
      transition: left 0.3s ease; /* Desplazamiento suave */
      z-index: 99;
    }

    /* Estilo para el título del menú */
    .sidebar-titulo {
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 15px 25px;
      margin-top: 40px; /* Espacio para que no choque con el botón ☰ */
      border-bottom: 2px solid #444;
      letter-spacing: 1px;
    }

    /* Listado de navegación */
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar ul li a {
      display: block;
      padding: 15px 25px;
      color: #bbb;
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid #333;
    }

    /* Cambio de color al pasar el cursor */
    .sidebar ul li a:hover {
      background-color: #333;
      color: white;
    }

    /* Clase que activa la animación para mostrar la barra */
    .sidebar.activa {
      left: 0;
    }

    /* El visor donde se proyectarán tus páginas independientes */
    .visor-paginas {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <button class="btn-menu" onclick="toggleSidebar()">☰</button>

  <div class="sidebar" id="miSidebar">
    <div class="sidebar-titulo">heredar la tierra</div>
    
    <ul>
      <li><a href="PAG 1/Heredar.html" target="pantalla" onclick="toggleSidebar()">Página 1</a></li>
      <li><a href="PAG 2/index.html" target="pantalla" onclick="toggleSidebar()">Página 2</a></li>
      <li><a href="PAG 3/index.html" target="pantalla" onclick="toggleSidebar()">Página 3</a></li>
      <li><a href="PAG 4/florecer.html" target="pantalla" onclick="toggleSidebar()">Página 4</a></li>
      <li><a href="PAG 5/cosechar.html" target="pantalla" onclick="toggleSidebar()">Página 5</a></li>
    </ul>
  </div>

  <iframe src="PAG%201/Heredar.html" name="pantalla" class="visor-paginas"></iframe>

  <script>
    function toggleSidebar() {
      var sidebar = document.getElementById("miSidebar");
      sidebar.classList.toggle("activa");
    }
  </script>

</body>
</html>
